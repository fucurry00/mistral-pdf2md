[project]
name = "mistral-ocr-process"
version = "0.1.0"
description = "PDF-to-Markdown pipeline: Mistral OCR, rule-based cleanup, Gemini proofreading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mistralai",
    "pypdf",
    "python-dotenv",
]

[project.scripts]
pipeline = "pipeline:main"
cleanup-ocr = "cleanup_ocr:main"
convert-pdf = "convert_pdf_to_markdown:main"
